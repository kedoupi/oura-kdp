<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oura.kdp.cool — Oura Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <h1>oura.kdp.cool</h1>
          <p class="sub">睡眠 · 准备度 · 活动</p>
        </div>
        <div class="header-actions">
          <span id="user-label" class="user-label" hidden></span>
          <button id="btn-connect" class="btn primary" type="button">用 Oura 登录</button>
          <button id="btn-logout" class="btn" type="button" hidden>退出</button>
        </div>
      </header>

      <p id="flash" class="flash" hidden></p>

      <section id="guest" class="guest">
        <h2>用 Oura 登录后查看个人看板</h2>
        <p>授权睡眠、准备度与活动日摘要。Token 只留在服务端，前端不会保存 Oura 凭证。</p>
        <button id="btn-connect-hero" class="btn primary" type="button">用 Oura 登录</button>
      </section>

      <div id="dashboard" class="dashboard" hidden>
        <section class="cards" id="summary-cards">
          <article class="card" data-metric="sleep">
            <h2>睡眠</h2>
            <p class="value" id="val-sleep">—</p>
            <p class="hint">平均分 / 近窗</p>
          </article>
          <article class="card" data-metric="readiness">
            <h2>准备度</h2>
            <p class="value" id="val-readiness">—</p>
            <p class="hint">平均分 / 近窗</p>
          </article>
          <article class="card" data-metric="activity">
            <h2>活动</h2>
            <p class="value" id="val-activity">—</p>
            <p class="hint">平均分 / 近窗</p>
          </article>
        </section>

        <section class="trends">
          <div class="trends-head">
            <h2>趋势</h2>
            <div class="range" role="group" aria-label="天数">
              <button type="button" class="chip" data-days="7">7 天</button>
              <button type="button" class="chip active" data-days="30">30 天</button>
              <button type="button" class="chip" data-days="90">90 天</button>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="trend-chart" height="120"></canvas>
          </div>
          <p id="status" class="status">登录后加载 Oura 日摘要…</p>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
