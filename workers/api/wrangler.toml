name = "oura-kdp-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Optional non-secret: FRONTEND_ORIGIN (set in .dev.vars for local Vite).
# Do not bake localhost into deployed [vars] — production infers the request origin.

[[d1_databases]]
binding = "DB"
database_name = "oura_kdp"
# Replace after: wrangler d1 create oura_kdp
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "oura_kdp_local"
migrations_dir = "../../migrations"

# Secrets (set via `wrangler secret put`, never commit):
# OURA_CLIENT_ID, OURA_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY, SESSION_SECRET
# Optional: OURA_REDIRECT_URI
